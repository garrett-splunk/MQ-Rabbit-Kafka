# Unified messaging observability demo — IBM MQ, Kafka, RabbitMQ → OTel Collector → Splunk O11y
x-otel-environment: &otel-environment
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-messaging-demo-lab}
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:-messaging-demo-lab},deployment.environment=${DEPLOYMENT_ENVIRONMENT:-messaging-demo-lab},service.namespace=mq-rabbit-kafka-demo,demo.name=mq-rabbit-kafka-demo
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}

x-mq-environment: &mq-environment
  MQ_QUEUE_MANAGER: ${MQ_QUEUE_MANAGER:-QM1}
  MQ_CONN_NAME: ${MQ_CONN_NAME:-mq(1414)}
  MQ_CHANNEL: ${MQ_CHANNEL:-DEV.APP.SVRCONN}
  MQ_USER: ${MQ_USER:-app}
  MQ_APP_PASSWORD: ${MQ_APP_PASSWORD:-passw0rd}
  MQ_REQUEST_QUEUE: ${MQ_REQUEST_QUEUE:-ORDER.REQ}
  MQ_RESPONSE_QUEUE: ${MQ_RESPONSE_QUEUE:-ORDER.RESP}

services:
  mq:
    platform: linux/amd64
    build:
      context: .
      dockerfile: mq/Dockerfile
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: ${MQ_QUEUE_MANAGER:-QM1}
      MQ_DEV: "true"
      MQ_ADMIN_PASSWORD: ${MQ_ADMIN_PASSWORD:-passw0rd}
      MQ_APP_PASSWORD: ${MQ_APP_PASSWORD:-passw0rd}
    ports:
      - "1414:1414"
      - "9443:9443"
    volumes:
      - qm1data:/mnt/mqm
    healthcheck:
      test: ["CMD", "chkmqready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-demo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-passw0rd}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/otelcol-config.yaml:/etc/otelcol/config.yaml:ro
    # Docker Desktop's embedded DNS (127.0.0.11) occasionally fails to resolve
    # ingest.us1.signalfx.com — that drops all metric exports while traces may
    # still flow on retry. Use public resolvers for reliable Splunk ingest.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
      - path: .env.splunk
        required: false
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-messaging-demo-lab}
      RABBITMQ_USER: ${RABBITMQ_USER:-demo}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-passw0rd}
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"

  ibm-mq-java-metrics:
    platform: linux/amd64
    build:
      context: ./ibm-mq-java-metrics
    depends_on:
      mq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      MQ_HOST: mq
      MQ_PORT: "1414"
      MQ_CHANNEL: MQOTEL.SVRCONN
      MQ_USER: ${MQ_USER:-app}
      MQ_PASSWORD: ${MQ_APP_PASSWORD:-passw0rd}
      OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:-messaging-demo-lab},deployment.environment=${DEPLOYMENT_ENVIRONMENT:-messaging-demo-lab},service.name=ibm-mq-java-metrics,service.namespace=mq-rabbit-kafka-demo
      SCRAPE_INTERVAL_SECONDS: "15"
    restart: unless-stopped

  order-producer:
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/order-producer/Dockerfile
    env_file: .env
    environment:
      <<: [*otel-environment, *mq-environment]
      OTEL_SERVICE_NAME: order-producer
      PORT: 8080
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    depends_on:
      mq:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8080:8080"

  order-consumer:
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/order-consumer/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      <<: [*otel-environment, *mq-environment]
      OTEL_SERVICE_NAME: order-consumer
      PORT: 8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    depends_on:
      mq:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8081:8081"

  inventory-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    env_file: .env
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: inventory-service
      PORT: 8082
    depends_on:
      otel-collector:
        condition: service_started
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  demo-site:
    image: nginx:alpine
    volumes:
      - ./demo-site:/usr/share/nginx/html:ro
    ports:
      - "8092:80"

volumes:
  qm1data:
