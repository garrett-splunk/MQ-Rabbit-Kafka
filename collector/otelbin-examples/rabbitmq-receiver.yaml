# RabbitMQ receiver → Splunk Observability Cloud
# Docs: https://help.splunk.com/en/splunk-observability-cloud/manage-data/splunk-distribution-of-the-opentelemetry-collector/get-started-with-the-splunk-distribution-of-the-opentelemetry-collector/collector-components/receivers/rabbitmq-receiver

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  rabbitmq:
    endpoint: http://localhost:15672
    username: demo
    password: ${env:RABBITMQ_PASSWORD}
    collection_interval: 15s

processors:
  batch:
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
  resource/add_environment:
    attributes:
      - key: deployment.environment.name
        value: messaging-demo-lab
        action: upsert

exporters:
  signalfx:
    access_token: ${SPLUNK_ACCESS_TOKEN}
    realm: ${SPLUNK_REALM}
    ingest_url: ${SPLUNK_INGEST_URL}
    api_url: ${SPLUNK_API_URL}

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [rabbitmq]
      processors: [memory_limiter, resource/add_environment, batch]
      exporters: [signalfx]
