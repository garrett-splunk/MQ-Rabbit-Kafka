# Splunk Distribution of the OpenTelemetry Collector — agent baseline (trimmed)
# Full reference: https://github.com/signalfx/splunk-otel-collector/blob/main/cmd/otelcol/config/collector/agent_config.yaml
# Visualize on OTelBin: see demo-site #otelbin-examples

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  host_metrics:
    collection_interval: 10s
    scrapers:
      cpu:
      memory:
      disk:
      network:

processors:
  batch:
  memory_limiter:
    check_interval: 2s
    limit_mib: 512
  resource_detection:
    detectors: [system]
    override: true

exporters:
  otlp_http:
    traces_endpoint: ${SPLUNK_INGEST_URL}/v2/trace/otlp
    headers:
      X-SF-Token: ${SPLUNK_ACCESS_TOKEN}
  signalfx:
    access_token: ${SPLUNK_ACCESS_TOKEN}
    api_url: ${SPLUNK_API_URL}
    ingest_url: ${SPLUNK_INGEST_URL}
    sync_host_metadata: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource_detection]
      exporters: [otlp_http]
    metrics:
      receivers: [host_metrics, otlp]
      processors: [memory_limiter, batch, resource_detection]
      exporters: [signalfx]
