# Unified messaging demo → Splunk Observability Cloud
# Metrics: IBM MQ (OTLP from Java Contrib), Kafka (kafkametrics), RabbitMQ (management API)
# Traces: OTLP from instrumented MQ sample apps

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  kafkametrics:
    brokers:
      - kafka:19092
    protocol_version: 3.6.0
    scrapers:
      - brokers
      - topics
      - consumers
    collection_interval: 30s

  rabbitmq:
    endpoint: http://rabbitmq:15672
    username: ${RABBITMQ_USER:-demo}
    password: ${RABBITMQ_PASSWORD:-passw0rd}
    collection_interval: 15s

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
  resource/add_environment:
    attributes:
      - key: deployment.environment.name
        value: ${DEPLOYMENT_ENVIRONMENT}
        action: upsert
      - key: deployment.environment
        value: ${DEPLOYMENT_ENVIRONMENT}
        action: upsert
      - key: demo.name
        value: mq-rabbit-kafka-demo
        action: upsert
  transform/mq_metrics_environment:
    metric_statements:
      - context: resource
        statements:
          - set(attributes["deployment.environment"], "messaging-demo-lab")
          - set(attributes["deployment.environment.name"], "messaging-demo-lab")

exporters:
  otlphttp/traces:
    traces_endpoint: ${SPLUNK_INGEST_URL}/v2/trace/otlp
    headers:
      X-SF-Token: ${SPLUNK_ACCESS_TOKEN}
  signalfx:
    access_token: ${SPLUNK_ACCESS_TOKEN}
    realm: ${SPLUNK_REALM}
    ingest_url: ${SPLUNK_INGEST_URL}
    api_url: ${SPLUNK_API_URL}
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/add_environment, batch]
      exporters: [otlphttp/traces, debug]
    metrics:
      receivers: [otlp, kafkametrics, rabbitmq]
      processors: [memory_limiter, resource/add_environment, transform/mq_metrics_environment, batch]
      exporters: [signalfx, debug]
