name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "demo-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish demo site to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: demo-site
          branch: gh-pages
          clean: true
          commit-message: "Deploy demo site from main"
